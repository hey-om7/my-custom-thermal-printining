<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50x30mm Sample Label</title>
    <style>
        body {
            /* Standard clean font */
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #000;
            margin: 0;
            padding: 0;
            
            /* Exact 50x30mm translation for 203 DPI print heads */
            width: 384px;
            height: 240px;
            
            box-sizing: border-box;
            border: 4px solid #000; /* Thick outer border to visualize edge */
            overflow: hidden;

            /* Force crisp, un-smoothed text for binary thermal printing */
            -webkit-font-smoothing: none;
            font-smoothing: none;
            text-rendering: geometricPrecision;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 12px;
            text-align: center;
        }

        .title {
            font-size: 36px;
            font-weight: 900; /* Maximum bold */
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 20px;
            font-weight: bold; /* Standard bold */
            border: 2px solid #000; /* Outlined instead of solid black fill */
            padding: 6px 12px;
            border-radius: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">HEAVY BOLD</div>
        <div class="subtitle">Sample Layout</div>
    </div>
</body>
</html>
